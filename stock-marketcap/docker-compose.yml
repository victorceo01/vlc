# Local dev infrastructure only — Postgres + Redis.
# No app containers yet (run apps with `pnpm dev`). No cloud/CI in MVP.
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockmc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockmc
      POSTGRES_PASSWORD: stockmc
      POSTGRES_DB: stockmc
    ports:
      - "5432:5432"
    volumes:
      - stockmc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockmc -d stockmc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stockmc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stockmc-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockmc-pgdata:
  stockmc-redisdata:
